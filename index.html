<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>In-Store Stock Catalogue</title>
  
  <!-- Export & Parsing Engines -->
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

  <style>
    /* ---------------------------------------------------
       PREMIUM DARK SLATE THEME (High Readability)
       --------------------------------------------------- */
    :root {
      --bg: #0b1121;             /* Deep Slate Background */
      --card-bg: #151e32;        /* Dark Blue-Grey Cards */
      --panel-bg: #1e293b;       /* Slightly Lighter Panel */
      --border: #334155;         /* Soft Border */
      --primary: #10b981;        /* Emerald Green Highlight */
      --primary-hover: #059669;  /* Darker Emerald */
      --accent: #fbbf24;         /* Amber/Gold Accent */
      --text: #f8fafc;           /* Bright White Text */
      --text-muted: #94a3b8;     /* Muted Grey Text for meta */
    }

    * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; -webkit-tap-highlight-color: transparent; }
    body { background: var(--bg); color: var(--text); margin: 0; padding: 12px 14px 80px 14px; display: flex; flex-direction: column; align-items: center; min-height: 100vh; }

    /* Loading Overlay */
    #loadingOverlay {
      position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
      background: rgba(11, 17, 33, 0.98); z-index: 99999; display: flex;
      align-items: center; justify-content: center; flex-direction: column;
    }
    .auth-card {
      background: var(--card-bg); border: 1px solid var(--border); padding: 26px;
      border-radius: 12px; max-width: 360px; width: 90%; text-align: center;
      box-shadow: 0 20px 40px rgba(0,0,0,0.5);
    }
    .auth-card h3 { color: var(--primary); margin: 0 0 8px 0; }
    .auth-card p { color: var(--text-muted); font-size: 0.85rem; margin: 0; }
    
    .main-spinner { width: 45px; height: 45px; border: 4px solid var(--panel-bg); border-top-color: var(--primary); border-radius: 50%; animation: spin 0.8s linear infinite; margin: 20px auto; }
    .spinner { width: 40px; height: 40px; border: 4px solid #1e293b; border-top-color: var(--primary); border-radius: 50%; animation: spin 0.8s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* Header & Panel */
    .header { width: 100%; max-width: 1250px; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 8px; }
    .header h2 { margin: 0; font-size: 1.35rem; color: var(--primary); }
    .control-panel { width: 100%; max-width: 1250px; background: var(--panel-bg); padding: 12px; border-radius: 10px; border: 1px solid var(--border); margin-bottom: 10px; display: flex; flex-direction: column; gap: 8px; }
    
    .filter-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(135px, 1fr)); gap: 6px; width: 100%; }
    .filter-box { display: flex; flex-direction: column; gap: 3px; position: relative; }
    .filter-label { font-size: 0.65rem; font-weight: 700; color: var(--text-muted); text-transform: uppercase; }

    /* Search & Wide Boxes */
    .search-input { background: var(--bg); border: 1px solid var(--border); color: #fff; padding: 7px 10px; border-radius: 6px; font-size: 0.78rem; outline: none; width: 100%; }
    .search-input:focus { border-color: var(--primary); }
    .filter-box-wide { grid-column: span 2; min-width: 250px; }

    .dropdown-btn { background: var(--bg); color: var(--text); border: 1px solid var(--border); padding: 7px 10px; border-radius: 6px; font-size: 0.78rem; text-align: left; cursor: pointer; display: flex; justify-content: space-between; align-items: center; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .dropdown-btn:hover { border-color: var(--primary); }
    .dropdown-btn::after { content: "▾"; font-size: 0.75rem; margin-left: 6px; color: var(--text-muted); flex-shrink: 0; }
    
    .dropdown-menu { display: none; position: absolute; top: calc(100% + 4px); left: 0; min-width: 220px; max-height: 310px; background: var(--bg); border: 1px solid var(--border); border-radius: 8px; z-index: 1000; flex-direction: column; padding: 8px; box-shadow: 0 15px 30px rgba(0,0,0,0.8); }
    .dropdown-menu.show { display: flex; }
    .dropdown-menu-wide { min-width: 440px; max-width: 520px; max-height: 380px; }

    .dropdown-toolbar { display: flex; flex-direction: column; gap: 6px; margin-bottom: 6px; border-bottom: 1px solid var(--border); padding-bottom: 6px; }
    .select-all-row { display: flex; align-items: center; justify-content: space-between; font-size: 0.75rem; color: var(--primary); cursor: pointer; padding: 2px 4px; }
    .select-all-row:hover { background: var(--panel-bg); border-radius: 4px; }
    .select-all-label { display: flex; align-items: center; gap: 6px; cursor: pointer; user-select: none; font-weight: 600; }

    .dropdown-search { background: var(--card-bg); border: 1px solid var(--border); color: #fff; padding: 6px 8px; border-radius: 4px; font-size: 0.76rem; outline: none; }
    .dropdown-search:focus { border-color: var(--primary); }
    .dropdown-list { overflow-y: auto; display: flex; flex-direction: column; gap: 3px; max-height: 180px; }
    .dropdown-menu-wide .dropdown-list { max-height: 260px; }

    .dropdown-item { display: flex; align-items: flex-start; gap: 6px; font-size: 0.76rem; cursor: pointer; padding: 5px 6px; border-radius: 4px; word-break: break-all; }
    .dropdown-item:hover { background: var(--panel-bg); }
    .dropdown-item input { margin-top: 2px; flex-shrink: 0; }

    .weight-row { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
    .weight-row select, .weight-row input { background: var(--bg); border: 1px solid var(--border); color: var(--text); padding: 6px 8px; border-radius: 6px; font-size: 0.78rem; outline: none; }
    .weight-row select { width: 125px; }
    .weight-row input { width: 75px; }

    .stats-bar { width: 100%; max-width: 1250px; display: flex; justify-content: space-between; align-items: center; background: var(--panel-bg); padding: 8px 12px; border-radius: 6px; border: 1px solid var(--border); margin-bottom: 10px; font-size: 0.78rem; color: var(--text-muted); flex-wrap: wrap; gap: 8px; }
    .stats-bar b { color: var(--primary); }
    .bulk-btn-group { display: flex; gap: 6px; align-items: center; }
    .btn-bulk { background: var(--card-bg); border: 1px solid var(--border); color: var(--text); padding: 4px 8px; border-radius: 4px; font-size: 0.72rem; cursor: pointer; font-weight: 600; }
    .btn-bulk:hover { border-color: var(--primary); color: #fff; }
    .btn-bulk-danger:hover { border-color: #ef4444; color: #ef4444; }

    /* Responsive Main Card */
    .main-card { width: 100%; max-width: 1250px; background: var(--card-bg); border: 1px solid var(--border); border-radius: 12px; padding: 16px; display: flex; flex-direction: column; gap: 14px; }
    .card-top { display: flex; gap: 20px; align-items: flex-start; }

    /* Image Viewer */
    .image-viewer { 
      width: 500px; height: 500px; min-width: 500px; background: #0f172a; 
      border-radius: 10px; overflow: hidden; display: flex; align-items: center; justify-content: center; 
      border: 1px solid var(--border); position: relative; cursor: zoom-in;
    }
    .image-viewer img { 
      width: 100%; height: 100%; 
      object-fit: contain; 
    }
    
    .zoom-hint {
      position: absolute; bottom: 10px; right: 10px; background: rgba(11, 17, 33, 0.75); color: #fff;
      padding: 4px 8px; border-radius: 4px; font-size: 0.68rem; pointer-events: none; backdrop-filter: blur(4px);
      border: 1px solid var(--border); opacity: 0.85;
    }
    .img-loader { position: absolute; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; color: var(--primary); font-size: 0.85rem; font-weight: 700; background: #0f172a; width: 100%; height: 100%; z-index: 5; }
    .img-fallback { color: #64748b; font-size: 0.85rem; text-align: center; display: none; padding: 20px; z-index: 6; }

    .special-tag-badge {
      position: absolute; top: 12px; left: 12px; 
      background: var(--bg); color: var(--accent); 
      border: 1px solid var(--border);
      padding: 4px 12px; border-radius: 6px; 
      font-size: 0.75rem; font-weight: 700; 
      text-transform: uppercase; z-index: 10;
      box-shadow: 0 4px 6px rgba(0,0,0,0.3);
    }

    .variant-details { flex: 1; display: flex; flex-direction: column; gap: 10px; min-width: 0; width: 100%; }
    .sku-badge { font-size: 1.35rem; font-weight: 800; color: var(--primary); font-family: monospace; }
    .ag-tag { font-size: 0.75rem; color: var(--text-muted); word-break: break-all; margin-top: 2px; }
    .pill-selected { background: #064e3b; color: #34d399; border: 1px solid #059669; padding: 4px 8px; border-radius: 4px; font-size: 0.7rem; font-weight: 700; }

    .metric-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
    .metric-box { background: var(--bg); padding: 7px 9px; border-radius: 6px; border: 1px solid var(--border); }
    .metric-lbl { font-size: 0.62rem; color: var(--text-muted); text-transform: uppercase; }
    .metric-val { font-size: 0.9rem; font-weight: 700; color: #fff; margin-top: 2px; }

    .section-title { font-size: 0.7rem; font-weight: 700; color: var(--text-muted); text-transform: uppercase; margin-bottom: 5px; display: flex; justify-content: space-between; align-items: center; }
    
    .detailed-tray { background: var(--bg); border: 1px solid var(--border); border-radius: 8px; padding: 10px; }
    .tray-table { width: 100%; border-collapse: collapse; font-size: 0.75rem; text-align: left; }
    .tray-table th { color: var(--text-muted); padding: 5px 6px; border-bottom: 1px solid var(--border); font-size: 0.68rem; text-transform: uppercase; }
    .tray-table td { padding: 5px 6px; border-bottom: 1px solid var(--card-bg); }

    /* Sticky Bottom Bar */
    .actions-bar { 
      position: sticky; bottom: 0; left: 0; width: 100%; max-width: 1250px; 
      background: rgba(11, 17, 33, 0.95); backdrop-filter: blur(8px); 
      border: 1px solid var(--border); border-radius: 10px; 
      padding: 10px 14px; display: flex; justify-content: space-between; 
      align-items: center; margin-top: 10px; box-shadow: 0 -8px 25px rgba(0,0,0,0.8); z-index: 500; 
    }
    .btn-nav { background: var(--border); color: #fff; border: none; padding: 10px 18px; border-radius: 6px; cursor: pointer; font-weight: 700; font-size: 0.85rem; }
    .btn-nav:hover { background: #475569; }
    .btn-nav:disabled { opacity: 0.3; cursor: not-allowed; }
    .btn-decision { display: flex; gap: 8px; }
    .btn-action { padding: 10px 18px; border-radius: 6px; font-size: 0.85rem; font-weight: 700; cursor: pointer; border: none; }
    .btn-skip { background: #334155; color: white; }
    .btn-skip:hover { background: #475569; }
    .btn-confirm { background: var(--primary); color: white; }
    .btn-confirm:hover { background: var(--primary-hover); }
    .btn-confirmed { background: #ef4444; color: white; }
    
    .export-btn { background: var(--primary); color: #fff; border: none; padding: 7px 12px; border-radius: 6px; cursor: pointer; font-weight: 700; font-size: 0.78rem; }

    /* Lightbox Modal */
    .lightbox-modal {
      display: none; position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
      background: rgba(11, 17, 33, 0.96); backdrop-filter: blur(12px);
      z-index: 10000; flex-direction: column; align-items: center; justify-content: center; padding: 16px; user-select: none;
    }
    .lightbox-modal.active { display: flex; }
    .lightbox-header { width: 100%; max-width: 900px; display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; gap: 10px; flex-wrap: wrap; }
    .lightbox-meta { display: flex; align-items: center; gap: 8px; color: #fff; flex-wrap: wrap; }
    .lightbox-badge { font-size: 1.3rem; font-weight: 800; color: var(--primary); font-family: monospace; }
    .lightbox-tag { font-size: 0.8rem; color: var(--text-muted); background: var(--card-bg); padding: 4px 8px; border-radius: 4px; border: 1px solid var(--border); }
    .lightbox-tag-wt { font-size: 0.82rem; font-weight: 700; color: var(--text); background: var(--primary-hover); border-color: var(--primary); }
    .lightbox-close-btn { background: var(--card-bg); color: #fff; border: 1px solid var(--border); width: 38px; height: 38px; border-radius: 50%; font-size: 1.2rem; font-weight: 700; cursor: pointer; display: flex; align-items: center; justify-content: center; }
    .lightbox-close-btn:hover { background: #ef4444; border-color: #ef4444; }
    .lightbox-body { width: 100%; max-width: 900px; height: calc(100vh - 160px); max-height: 800px; background: #0f172a; border-radius: 14px; overflow: hidden; display: flex; align-items: center; justify-content: center; position: relative; border: 2px solid var(--border); }
    
    .lightbox-body img { 
      width: 100%; height: 100%; 
      object-fit: contain; 
    }
    
    .lightbox-actions-bar { margin-top: 12px; width: 100%; max-width: 900px; display: flex; justify-content: space-between; align-items: center; background: rgba(11, 17, 33, 0.95); border: 1px solid var(--border); border-radius: 10px; padding: 10px 16px; backdrop-filter: blur(8px); }

    /* Download/Export Choice Modal */
    #exportModal {
      display: none; position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
      background: rgba(11, 17, 33, 0.85); backdrop-filter: blur(8px);
      z-index: 20000; align-items: center; justify-content: center;
    }
    #exportModal.active { display: flex; }
    .export-card {
      background: var(--card-bg); border: 1px solid var(--border); border-radius: 12px;
      padding: 22px; width: 90%; max-width: 480px; box-shadow: 0 20px 40px rgba(0,0,0,0.8);
    }
    .export-card h3 { margin: 0 0 6px 0; color: var(--primary); font-size: 1.15rem; }
    .export-card p { font-size: 0.8rem; color: var(--text-muted); margin: 0 0 16px 0; }
    .export-options-grid { display: flex; flex-direction: column; gap: 12px; margin-bottom: 18px; }
    .export-type-btn {
      display: flex; align-items: center; justify-content: space-between;
      background: var(--bg); border: 1px solid var(--border); color: #fff;
      padding: 12px 14px; border-radius: 8px; cursor: pointer; text-align: left;
    }
    .export-type-btn:hover { border-color: var(--primary); }
    .pdf-field-selector {
      background: var(--bg); border: 1px solid var(--border); border-radius: 8px;
      padding: 12px; display: flex; flex-direction: column; gap: 8px; margin-bottom: 16px;
    }
    .pdf-field-title { font-size: 0.72rem; font-weight: 700; color: var(--text-muted); text-transform: uppercase; margin-bottom: 4px; }
    .pdf-fields-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .pdf-chk-label { font-size: 0.76rem; color: var(--text); display: flex; align-items: center; gap: 6px; cursor: pointer; }
    .export-modal-footer { display: flex; justify-content: flex-end; gap: 10px; }
    .btn-secondary { background: var(--border); color: #fff; border: none; padding: 8px 14px; border-radius: 6px; cursor: pointer; font-size: 0.8rem; font-weight: 600; }
    .btn-primary-action { background: var(--primary); color: #fff; border: none; padding: 8px 16px; border-radius: 6px; cursor: pointer; font-size: 0.8rem; font-weight: 700; }

    @media (max-width: 980px) {
      body { padding: 10px 10px 80px 10px; }
      .card-top { flex-direction: column; align-items: center; gap: 16px; }
      .image-viewer { width: 100%; max-width: 440px; height: auto; aspect-ratio: 1 / 1; min-width: 0; }
      .metric-grid { grid-template-columns: repeat(2, 1fr); gap: 6px; }
      .filter-grid { grid-template-columns: repeat(2, 1fr); }
      .filter-box-wide { grid-column: span 2; min-width: 100%; }
      .dropdown-menu-wide { min-width: 90vw; max-width: 90vw; }
      .btn-nav, .btn-action { padding: 10px 14px; font-size: 0.82rem; }
      .lightbox-body { height: calc(100vh - 200px); }
    }
  </style>
</head>
<body>

  <!-- Loading Overlay -->
  <div id="loadingOverlay">
    <div class="auth-card">
      <h3>In-Store Catalog</h3>
      <div class="main-spinner"></div>
      <p id="loadingMsg" style="color: var(--primary); font-weight: bold;">Fetching Live Inventory...</p>
    </div>
  </div>

  <div class="header">
    <h2>In-Store Catalogue</h2>
    <button class="export-btn" onclick="openExportModal()">📥 Download Selected (<span id="exportCount">0</span>)</button>
  </div>

  <div class="control-panel">
    <div class="filter-grid">
      <div class="filter-box">
        <span class="filter-label">Search (SKU, Exact WT, Tag)</span>
        <input type="text" class="search-input" id="skuSearchInput" placeholder="e.g. 4.250, Ring, Offer..." oninput="handleUniversalSearch()">
      </div>

      <div class="filter-box" id="fb-tag">
        <span class="filter-label">Special Tag</span>
        <button class="dropdown-btn" onclick="toggleDropdown('tag')">All Tags</button>
        <div class="dropdown-menu" id="menu-tag">
          <div class="dropdown-toolbar">
            <div class="select-all-row" onclick="toggleSelectAllDropdown('tag')">
              <span class="select-all-label">
                <input type="checkbox" id="chk-all-tag" onclick="event.stopPropagation(); toggleSelectAllDropdown('tag')">
                <span>Select All</span>
              </span>
              <small id="lbl-all-tag">0 / 0</small>
            </div>
            <input type="text" class="dropdown-search" placeholder="Search tag..." oninput="filterChecklist('tag', this.value)">
          </div>
          <div class="dropdown-list" id="list-tag"></div>
        </div>
      </div>

      <div class="filter-box" id="fb-design">
        <span class="filter-label">Design</span>
        <button class="dropdown-btn" onclick="toggleDropdown('design')">All Designs</button>
        <div class="dropdown-menu" id="menu-design">
          <div class="dropdown-toolbar">
            <div class="select-all-row" onclick="toggleSelectAllDropdown('design')">
              <span class="select-all-label">
                <input type="checkbox" id="chk-all-design" onclick="event.stopPropagation(); toggleSelectAllDropdown('design')">
                <span>Select All</span>
              </span>
              <small id="lbl-all-design">0 / 0</small>
            </div>
            <input type="text" class="dropdown-search" placeholder="Search design..." oninput="filterChecklist('design', this.value)">
          </div>
          <div class="dropdown-list" id="list-design"></div>
        </div>
      </div>

      <div class="filter-box" id="fb-cat">
        <span class="filter-label">Product Cat</span>
        <button class="dropdown-btn" onclick="toggleDropdown('cat')">All Categories</button>
        <div class="dropdown-menu" id="menu-cat">
          <div class="dropdown-toolbar">
            <div class="select-all-row" onclick="toggleSelectAllDropdown('cat')">
              <span class="select-all-label">
                <input type="checkbox" id="chk-all-cat" onclick="event.stopPropagation(); toggleSelectAllDropdown('cat')">
                <span>Select All</span>
              </span>
              <small id="lbl-all-cat">0 / 0</small>
            </div>
            <input type="text" class="dropdown-search" placeholder="Search..." oninput="filterChecklist('cat', this.value)">
          </div>
          <div class="dropdown-list" id="list-cat"></div>
        </div>
      </div>

      <div class="filter-box" id="fb-cluster">
        <span
